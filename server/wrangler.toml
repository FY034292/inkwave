# INKWAVE friend-match relay (Cloudflare Worker + Durable Objects).
# Deploy: cd server && npm install && npx wrangler deploy   (then put the printed URL in src/config.js → NET.server)
name = "inkwave-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
